<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Agent API 调试页</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --warning: #d97706;
      --warning-hover: #b45309;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --result-bg: #0b1736;
      --result-text: #e5edff;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-title {
      margin: 0 0 8px;
      font-size: 40px;
      font-weight: 800;
    }

    .page-desc {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px;
    }

    .top-panel,
    .card,
    .result-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .top-panel {
      padding: 20px;
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
      font-family: Consolas, Monaco, monospace;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      transition: transform .08s ease, background .18s ease, opacity .18s ease;
    }

    .button:hover { background: var(--primary-hover); }
    .button:active { transform: translateY(1px); }
    .button.warning { background: var(--warning); }
    .button.warning:hover { background: var(--warning-hover); }
    .button.danger { background: var(--danger); }
    .button.danger:hover { background: var(--danger-hover); }
    .button.secondary {
      color: var(--text);
      background: #e5e7eb;
    }
    .button.secondary:hover {
      background: #d1d5db;
    }
    .button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .card {
      padding: 16px;
      min-height: 280px;
    }

    .card h3 {
      margin: 0 0 14px;
      font-size: 30px;
      line-height: 1.2;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-panel {
      margin-top: 20px;
      overflow: hidden;
    }

    .result-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result-header h3 {
      margin: 0;
      font-size: 22px;
    }

    .status-text {
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .result-text {
      width: 100%;
      min-height: 340px;
      border: none;
      border-radius: 0;
      margin: 0;
      padding: 18px;
      background: var(--result-bg);
      color: var(--result-text);
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.7;
    }

    .span-2 { grid-column: span 2; }
    .span-4 { grid-column: span 4; }

    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .span-4 { grid-column: span 2; }
    }

    @media (max-width: 760px) {
      .container { padding: 16px; }
      .page-title { font-size: 30px; }
      .grid { grid-template-columns: 1fr; }
      .span-2, .span-4 { grid-column: span 1; }
      .card h3 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="page-title">Job Agent API 调试页</h1>
    <p class="page-desc">直接调用你的后端接口，并在页面里显示原始 JSON 文本。支持手动清空结果文本。</p>

    <section class="top-panel">
      <label class="field-label" for="baseUrl">后端 Base URL</label>
      <input id="baseUrl" value="http://localhost:5003" placeholder="例如：https://job-agent-api-xxx.run.app" />
      <div class="hint">不要带最后的斜杠。</div>

      <div class="toolbar">
        <button class="button secondary" onclick="callHealth()">GET /health</button>
        <button class="button secondary" onclick="callLatestJobs()">GET /api/jobs/latest</button>
        <button class="button secondary" onclick="callSearchJobs()">GET /api/jobs/search</button>
        <button class="button danger" onclick="clearResultText()">手动清空文本</button>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h3>搜索职位</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="searchKeyword">keyword</label>
            <input id="searchKeyword" placeholder="例如 unity" />
          </div>
          <div>
            <label class="field-label" for="searchCompanyName">companyName</label>
            <input id="searchCompanyName" placeholder="例如 Databricks" />
          </div>
          <div>
            <label class="field-label" for="searchWorkMode">workMode</label>
            <input id="searchWorkMode" placeholder="remote / hybrid / onsite" />
          </div>
          <div>
            <label class="field-label" for="searchSeniorityLevel">seniorityLevel</label>
            <input id="searchSeniorityLevel" placeholder="junior / mid / senior" />
          </div>
          <div>
            <label class="field-label" for="searchAnalysisStatus">analysisStatus</label>
            <input id="searchAnalysisStatus" placeholder="pending / completed / failed" />
          </div>
          <div>
            <label class="field-label" for="searchLimit">limit</label>
            <input id="searchLimit" value="20" />
          </div>
          <button class="button" onclick="callSearchJobs()">查询</button>
        </div>
      </div>

      <div class="card">
        <h3>单条 URL 导入</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="importUrl">职位 URL</label>
            <input id="importUrl" placeholder="https://..." />
          </div>
          <div>
            <label class="field-label" for="importSourceType">sourceType</label>
            <input id="importSourceType" value="manual_url" />
          </div>
          <div>
            <label class="field-label" for="importNotes">notes</label>
            <input id="importNotes" value="前端页面测试" />
          </div>
          <button class="button" onclick="callImportFromUrl()">POST /api/job-imports/from-url</button>
        </div>
      </div>

      <div class="card">
        <h3>Greenhouse 批量导入</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="greenhouseBoardToken">boardToken</label>
            <input id="greenhouseBoardToken" value="databricks" />
          </div>
          <button class="button" onclick="callGreenhouse()">POST /api/job-imports/from-greenhouse</button>
        </div>
      </div>

      <div class="card">
        <h3>Lever 批量导入</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="leverCompany">company</label>
            <input id="leverCompany" value="spotify" />
          </div>
          <button class="button" onclick="callLever()">POST /api/job-imports/from-lever</button>
        </div>
      </div>

      <div class="card">
        <h3>Ashby 批量导入</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="ashbyOrganizationSlug">organizationSlug</label>
            <input id="ashbyOrganizationSlug" value="notion" />
          </div>
          <button class="button" onclick="callAshby()">POST /api/job-imports/from-ashby</button>
        </div>
      </div>

      <div class="card">
        <h3>Workable 批量导入</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="workableSubdomain">subdomain</label>
            <input id="workableSubdomain" value="huggingface" />
          </div>
          <button class="button" onclick="callWorkable()">POST /api/job-imports/from-workable</button>
        </div>
      </div>

      <div class="card">
        <h3>SmartRecruiters 批量导入</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="smartrecruitersCompanyIdentifier">companyIdentifier</label>
            <input id="smartrecruitersCompanyIdentifier" value="smartrecruiters" />
          </div>
          <button class="button" onclick="callSmartRecruiters()">POST /api/job-imports/from-smartrecruiters</button>
        </div>
      </div>

      <div class="card">
        <h3>Recruitee 批量导入</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="recruiteeCompanyIdOrSlug">companyIdOrSlug</label>
            <input id="recruiteeCompanyIdOrSlug" value="personio" />
          </div>
          <button class="button" onclick="callRecruitee()">POST /api/job-imports/from-recruitee</button>
        </div>
      </div>

      <div class="card">
        <h3>单条职位分析</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="analysisJobId">jobId</label>
            <input id="analysisJobId" placeholder="填写职位 UUID" />
          </div>
          <div>
            <label class="field-label" for="analysisForce">force</label>
            <select id="analysisForce">
              <option value="false" selected>false</option>
              <option value="true">true</option>
            </select>
          </div>
          <button class="button" onclick="callRunSingleAnalysis()">POST /api/job-analyses/{jobId}/run</button>
        </div>
      </div>

      <div class="card">
        <h3>批量分析待处理职位</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="pendingLimit">limit</label>
            <input id="pendingLimit" value="10" />
          </div>
          <div>
            <label class="field-label" for="pendingForce">force</label>
            <select id="pendingForce">
              <option value="false" selected>false</option>
              <option value="true">true</option>
            </select>
          </div>
          <button class="button" onclick="callRunPendingAnalysis()">POST /api/job-analyses/run-pending</button>
        </div>
      </div>

      <div class="card span-2">
        <h3>统一调度入口</h3>
        <div class="form-stack">
          <div>
            <label class="field-label" for="scheduleBody">POST /api/schedules/run 的请求体</label>
            <textarea id="scheduleBody">{
  "mode": "import_then_analyze",
  "sourceNames": ["greenhouse", "lever", "ashby"],
  "limit": 20,
  "runGreenhouse": true,
  "greenhouseBoardTokens": ["databricks"],
  "runLever": true,
  "leverCompanies": ["spotify"],
  "runAshby": true,
  "ashbyOrganizationSlugs": ["notion"],
  "analyzeAfterImport": true
}</textarea>
          </div>
          <div class="toolbar">
            <button class="button warning" onclick="callScheduleRun()">POST /api/schedules/run</button>
          </div>
        </div>
      </div>
    </section>

    <section class="result-panel">
      <div class="result-header">
        <div>
          <h3>结果文本</h3>
          <div id="statusText" class="status-text">状态：等待调用</div>
        </div>
        <div class="toolbar" style="margin-top:0;">
          <button class="button secondary" onclick="copyResultText()">复制文本</button>
          <button class="button danger" onclick="clearResultText()">清空文本</button>
        </div>
      </div>
      <textarea id="resultText" class="result-text" spellcheck="false">这里会显示接口返回的原始 JSON 文本。</textarea>
    </section>
  </div>

  <script>
    function getBaseUrl() {
      return document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
    }

    function setStatus(message) {
      document.getElementById('statusText').textContent = '状态：' + message;
    }

    function setResultText(text) {
      document.getElementById('resultText').value = text;
    }

    function clearResultText() {
      setResultText('');
      setStatus('文本已清空');
    }

    async function copyResultText() {
      const text = document.getElementById('resultText').value;
      try {
        await navigator.clipboard.writeText(text);
        setStatus('结果文本已复制');
      } catch {
        setStatus('复制失败，请手动复制');
      }
    }

    function buildUrl(path, query) {
      const baseUrl = getBaseUrl();
      const url = new URL(baseUrl + path);
      if (query) {
        Object.keys(query).forEach(key => {
          const value = query[key];
          if (value !== '' && value !== null && value !== undefined) {
            url.searchParams.set(key, value);
          }
        });
      }
      return url.toString();
    }

    async function requestJson(method, path, body, query) {
      const url = buildUrl(path, query);
      setStatus('请求中...');

      const options = {
        method,
        headers: {
          'Accept': 'application/json, text/plain, */*'
        }
      };

      if (method !== 'GET') {
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(body ?? {});
      }

      try {
        const response = await fetch(url, options);
        const rawText = await response.text();
        let prettyText = rawText;

        try {
          prettyText = JSON.stringify(JSON.parse(rawText), null, 2);
        } catch {
        }

        const resultLines = [
          '时间：' + new Date().toLocaleString(),
          '请求地址：' + url,
          '请求方法：' + method,
          '请求体：',
          method === 'GET' ? '(无)' : JSON.stringify(body ?? {}, null, 2),
          '',
          '状态码：' + response.status + ' ' + response.statusText,
          '响应内容：',
          prettyText
        ];

        setResultText(resultLines.join('\n'));
        setStatus(response.ok ? '调用成功' : '调用失败');
      } catch (error) {
        setResultText([
          '时间：' + new Date().toLocaleString(),
          '请求失败：' + (error?.message || String(error))
        ].join('\n'));
        setStatus('网络异常');
      }
    }

    function callHealth() {
      requestJson('GET', '/health');
    }

    function callLatestJobs() {
      const limit = document.getElementById('searchLimit').value.trim() || '20';
      requestJson('GET', '/api/jobs/latest', null, { limit });
    }

    function callSearchJobs() {
      requestJson('GET', '/api/jobs/search', null, {
        keyword: document.getElementById('searchKeyword').value.trim(),
        companyName: document.getElementById('searchCompanyName').value.trim(),
        workMode: document.getElementById('searchWorkMode').value.trim(),
        seniorityLevel: document.getElementById('searchSeniorityLevel').value.trim(),
        analysisStatus: document.getElementById('searchAnalysisStatus').value.trim(),
        limit: document.getElementById('searchLimit').value.trim() || '20'
      });
    }

    function callImportFromUrl() {
      requestJson('POST', '/api/job-imports/from-url', {
        url: document.getElementById('importUrl').value.trim(),
        sourceType: document.getElementById('importSourceType').value.trim(),
        notes: document.getElementById('importNotes').value.trim()
      });
    }

    function callGreenhouse() {
      requestJson('POST', '/api/job-imports/from-greenhouse', {
        boardToken: document.getElementById('greenhouseBoardToken').value.trim()
      });
    }

    function callLever() {
      requestJson('POST', '/api/job-imports/from-lever', {
        company: document.getElementById('leverCompany').value.trim()
      });
    }

    function callAshby() {
      requestJson('POST', '/api/job-imports/from-ashby', {
        organizationSlug: document.getElementById('ashbyOrganizationSlug').value.trim()
      });
    }

    function callWorkable() {
      requestJson('POST', '/api/job-imports/from-workable', {
        subdomain: document.getElementById('workableSubdomain').value.trim()
      });
    }

    function callSmartRecruiters() {
      requestJson('POST', '/api/job-imports/from-smartrecruiters', {
        companyIdentifier: document.getElementById('smartrecruitersCompanyIdentifier').value.trim()
      });
    }

    function callRecruitee() {
      requestJson('POST', '/api/job-imports/from-recruitee', {
        companyIdOrSlug: document.getElementById('recruiteeCompanyIdOrSlug').value.trim()
      });
    }

    function callRunSingleAnalysis() {
      const jobId = document.getElementById('analysisJobId').value.trim();
      const force = document.getElementById('analysisForce').value;
      if (!jobId) {
        setStatus('请先填写 jobId');
        return;
      }
      requestJson('POST', `/api/job-analyses/${encodeURIComponent(jobId)}/run`, null, { force });
    }

    function callRunPendingAnalysis() {
      requestJson('POST', '/api/job-analyses/run-pending', null, {
        limit: document.getElementById('pendingLimit').value.trim() || '10',
        force: document.getElementById('pendingForce').value
      });
    }

    function callScheduleRun() {
      try {
        const body = JSON.parse(document.getElementById('scheduleBody').value);
        requestJson('POST', '/api/schedules/run', body);
      } catch {
        setStatus('调度请求体不是合法 JSON');
      }
    }
  </script>
</body>
</html>
