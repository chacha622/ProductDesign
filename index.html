<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Agent API 调试页</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0;
      background: #f6f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .desc {
      margin: 0 0 20px;
      color: #4b5563;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    label {
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }
    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: Consolas, monospace;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    button.secondary {
      background: #4b5563;
    }
    button.warn {
      background: #b45309;
    }
    button:hover {
      opacity: 0.92;
    }
    .small {
      font-size: 12px;
      color: #6b7280;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0f172a;
      color: #e5e7eb;
      padding: 16px;
      border-radius: 12px;
      min-height: 320px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .status {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
    }
    .ok { color: #15803d; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Job Agent API 调试页</h1>
    <p class="desc">直接调用你的后端接口，并在页面里显示原始 JSON 文本。</p>

    <div class="card">
      <div class="field">
        <label for="baseUrl">后端 Base URL</label>
        <input id="baseUrl" value="https://job-agent-api-asia-102039125042.asia-southeast1.run.app" />
        <div class="small">不要带最后的斜杠。</div>
      </div>
      <div class="btn-row">
        <button class="secondary" onclick="callGet('/health')">GET /health</button>
        <button class="secondary" onclick="callGet('/api/jobs/latest?limit=5')">GET /api/jobs/latest</button>
        <button class="secondary" onclick="callGet(buildSearchUrl())">GET /api/jobs/search</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>搜索职位</h3>
        <div class="field">
          <label for="keyword">keyword</label>
          <input id="keyword" placeholder="例如 unity" />
        </div>
        <div class="field">
          <label for="companyName">companyName</label>
          <input id="companyName" placeholder="例如 Databricks" />
        </div>
        <div class="field">
          <label for="workMode">workMode</label>
          <input id="workMode" placeholder="remote / hybrid / onsite" />
        </div>
        <div class="field">
          <label for="seniorityLevel">seniorityLevel</label>
          <input id="seniorityLevel" placeholder="junior / mid / senior" />
        </div>
        <div class="field">
          <label for="analysisStatus">analysisStatus</label>
          <input id="analysisStatus" placeholder="pending / completed / failed" />
        </div>
        <div class="field">
          <label for="searchLimit">limit</label>
          <input id="searchLimit" value="20" />
        </div>
        <div class="btn-row">
          <button onclick="callGet(buildSearchUrl())">查询</button>
        </div>
      </div>

      <div class="card">
        <h3>单条 URL 导入</h3>
        <div class="field">
          <label for="jobUrl">职位 URL</label>
          <input id="jobUrl" placeholder="https://..." />
        </div>
        <div class="field">
          <label for="sourceType">sourceType</label>
          <input id="sourceType" value="manual_url" />
        </div>
        <div class="field">
          <label for="notes">notes</label>
          <input id="notes" value="前端页面测试" />
        </div>
        <div class="btn-row">
          <button onclick="importFromUrl()">POST /api/job-imports/from-url</button>
        </div>
      </div>

      <div class="card">
        <h3>Greenhouse 批量导入</h3>
        <div class="field">
          <label for="greenhouseBoardToken">boardToken</label>
          <input id="greenhouseBoardToken" value="databricks" />
        </div>
        <div class="btn-row">
          <button onclick="importFromGreenhouse()">POST /api/job-imports/from-greenhouse</button>
        </div>
      </div>

      <div class="card">
        <h3>Lever 批量导入</h3>
        <div class="field">
          <label for="leverCompany">company</label>
          <input id="leverCompany" value="spotify" />
        </div>
        <div class="btn-row">
          <button onclick="importFromLever()">POST /api/job-imports/from-lever</button>
        </div>
      </div>

      <div class="card">
        <h3>Ashby 批量导入</h3>
        <div class="field">
          <label for="ashbySlug">organizationSlug</label>
          <input id="ashbySlug" value="notion" />
        </div>
        <div class="btn-row">
          <button onclick="importFromAshby()">POST /api/job-imports/from-ashby</button>
        </div>
      </div>

      <div class="card">
        <h3>单条职位分析</h3>
        <div class="field">
          <label for="analysisJobId">jobId</label>
          <input id="analysisJobId" placeholder="从 jobs/search 结果里复制 id" />
        </div>
        <div class="btn-row">
          <button onclick="runSingleAnalysis()">POST /api/job-analyses/{jobId}/run</button>
        </div>
      </div>

      <div class="card">
        <h3>批量分析待处理职位</h3>
        <div class="field">
          <label for="pendingLimit">limit</label>
          <input id="pendingLimit" value="10" />
        </div>
        <div class="btn-row">
          <button onclick="runPendingAnalysis()">POST /api/job-analyses/run-pending</button>
        </div>
      </div>

      <div class="card">
        <h3>统一调度入口</h3>
        <div class="field">
          <label for="scheduleBody">POST /api/schedules/run 的请求体</label>
          <textarea id="scheduleBody">{
  "runGreenhouse": true,
  "greenhouseBoardTokens": ["databricks"],
  "runLever": true,
  "leverCompanies": ["spotify"],
  "runAshby": true,
  "ashbyOrganizationSlugs": ["notion"],
  "analyzeAfterImport": true
}</textarea>
        </div>
        <div class="btn-row">
          <button class="warn" onclick="runSchedule()">POST /api/schedules/run</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="status" class="status">状态：等待调用</div>
      <pre id="output">这里会显示接口返回的原始 JSON 文本。</pre>
      <div class="btn-row">
        <button class="secondary" onclick="clearOutput()">清空输出</button>
      </div>
    </div>
  </div>

  <script>
    function getBaseUrl() {
      return document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
    }

    function setStatus(text, isError = false) {
      const status = document.getElementById('status');
      status.textContent = text;
      status.className = 'status ' + (isError ? 'err' : 'ok');
    }

    function setOutput(data) {
      const output = document.getElementById('output');
      if (typeof data === 'string') {
        output.textContent = data;
        return;
      }
      output.textContent = JSON.stringify(data, null, 2);
    }

    function clearOutput() {
      setStatus('状态：等待调用');
      setOutput('这里会显示接口返回的原始 JSON 文本。');
    }

    async function requestJson(path, method = 'GET', body = null) {
      const url = getBaseUrl() + path;
      setStatus(`请求中：${method} ${url}`);

      const options = {
        method,
        headers: {
          'Accept': 'application/json, text/plain, */*'
        }
      };

      if (body !== null) {
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(body);
      }

      try {
        const response = await fetch(url, options);
        const text = await response.text();
        let parsed;

        try {
          parsed = text ? JSON.parse(text) : { rawText: '', status: response.status };
        } catch {
          parsed = {
            status: response.status,
            ok: response.ok,
            rawText: text
          };
        }

        setStatus(`完成：HTTP ${response.status} ${response.statusText}`, !response.ok);
        setOutput(parsed);
      } catch (error) {
        setStatus('请求失败：' + error.message, true);
        setOutput({
          error: error.message,
          note: '如果这是 CORS 问题，请把当前页面所在域名加入后端 CORS 白名单。'
        });
      }
    }

    function callGet(path) {
      requestJson(path, 'GET');
    }

    function buildSearchUrl() {
      const keyword = encodeURIComponent(document.getElementById('keyword').value.trim());
      const companyName = encodeURIComponent(document.getElementById('companyName').value.trim());
      const workMode = encodeURIComponent(document.getElementById('workMode').value.trim());
      const seniorityLevel = encodeURIComponent(document.getElementById('seniorityLevel').value.trim());
      const analysisStatus = encodeURIComponent(document.getElementById('analysisStatus').value.trim());
      const limit = encodeURIComponent(document.getElementById('searchLimit').value.trim() || '20');
      return `/api/jobs/search?keyword=${keyword}&companyName=${companyName}&workMode=${workMode}&seniorityLevel=${seniorityLevel}&analysisStatus=${analysisStatus}&limit=${limit}`;
    }

    function importFromUrl() {
      requestJson('/api/job-imports/from-url', 'POST', {
        url: document.getElementById('jobUrl').value.trim(),
        sourceType: document.getElementById('sourceType').value.trim(),
        notes: document.getElementById('notes').value.trim()
      });
    }

    function importFromGreenhouse() {
      requestJson('/api/job-imports/from-greenhouse', 'POST', {
        boardToken: document.getElementById('greenhouseBoardToken').value.trim()
      });
    }

    function importFromLever() {
      requestJson('/api/job-imports/from-lever', 'POST', {
        company: document.getElementById('leverCompany').value.trim()
      });
    }

    function importFromAshby() {
      requestJson('/api/job-imports/from-ashby', 'POST', {
        organizationSlug: document.getElementById('ashbySlug').value.trim()
      });
    }

    function runSingleAnalysis() {
      const jobId = document.getElementById('analysisJobId').value.trim();
      requestJson(`/api/job-analyses/${encodeURIComponent(jobId)}/run`, 'POST');
    }

    function runPendingAnalysis() {
      const limit = encodeURIComponent(document.getElementById('pendingLimit').value.trim() || '10');
      requestJson(`/api/job-analyses/run-pending?limit=${limit}`, 'POST');
    }

    function runSchedule() {
      let body;
      try {
        body = JSON.parse(document.getElementById('scheduleBody').value);
      } catch (error) {
        setStatus('请求体 JSON 格式错误：' + error.message, true);
        return;
      }
      requestJson('/api/schedules/run', 'POST', body);
    }
  </script>
</body>
</html>
